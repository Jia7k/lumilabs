<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moderation Dashboard — Lumi5 Labs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css?v=20260728.4" />
</head>

<body class="dashboard protected-page">

  <a class="skip-link" id="moderation-skip-link" href="#moderation-main">Skip to main content</a>

  <nav class="nav" id="moderation-nav">
    <a class="nav-logo" href="index.html">
      <div class="logo-icon"><i class="ti ti-trending-up"></i></div>Lumi5 Labs
    </a>
    <div class="nav-links">
      <div class="nav-btn-wrap">
        <button class="nav-btn active" onclick="window.location.href='moderatordashboard.html'"><i class="ti ti-shield"></i> Moderation Dashboard</button>
        <span class="nav-badge" id="nav-pending-badge"></span>
      </div>
      <button class="nav-btn" onclick="window.location.href='audit-logs.html'">
        <i class="ti ti-settings"></i> Audit Logs
      </button>
    </div>
    <div class="nav-right">
      <div class="role-menu" id="role-menu">
        <button class="user-chip" id="role-menu-button" type="button" aria-haspopup="true" aria-expanded="false">
          <div class="avatar" id="user-avatar"></div>
          <div class="user-info">
            <div class="name" id="user-name"></div>
            <div class="role" id="user-role"></div>
          </div>
          <i class="ti ti-chevron-down" style="font-size:14px; color:var(--text-secondary)"></i>
        </button>

        <div class="role-dropdown" role="menu">
          <button class="role-option" type="button" onclick="signOut()" role="menuitem">
            <span class="role-option-avatar" style="background:#EF4444;">
              <i class="ti ti-logout" style="font-size:14px;"></i>
            </span>
            <span class="role-option-name">Sign Out</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="main" id="moderation-main" tabindex="-1">
    <h1 class="welcome-heading" id="page-title"></h1>
    <p class="welcome-sub" id="page-subtitle"></p>

    <div class="stats-grid">
      <div class="stat-card orange-card">
        <div>
          <div class="stat-label">Pending Review</div>
          <div class="stat-value" id="stat-pending"></div>
        </div>
        <div class="stat-icon icon-white-tint"><i class="ti ti-clock"></i></div>
      </div>
      <div class="stat-card">
        <div>
          <div class="stat-label">Approved Portfolios</div>
          <div class="stat-value" id="stat-approved"></div>
        </div>
        <div class="stat-icon icon-green"><i class="ti ti-check"></i></div>
      </div>
      <div class="stat-card">
        <div>
          <div class="stat-label">Rejected Portfolios</div>
          <div class="stat-value" id="stat-rejected"></div>
        </div>
        <div class="stat-icon icon-red"><i class="ti ti-x"></i></div>
      </div>
      <div class="stat-card">
        <div>
          <div class="stat-label">Investor Interests</div>
          <div class="stat-value" id="stat-matches"></div>
        </div>
        <div class="stat-icon icon-purple"><i class="ti ti-users"></i></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">
          Moderation Queue <span class="badge-yellow" id="queue-badge"></span>
        </div>
        <div class="admin-section-feedback">
          <p class="dashboard-status admin-dashboard-status"
             id="moderation-status"
             role="status"
             aria-live="polite"
             tabindex="-1"
             hidden></p>
          <button class="btn btn-outline admin-retry-btn"
                  id="moderation-retry-btn"
                  type="button"
                  hidden>
            <i class="ti ti-refresh"></i> Try again
          </button>
        </div>
        <button class="btn-review" onclick="window.location.href='audit-logs.html'">
          View Audit Logs
        </button>
      </div>
      <div class="table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th>Startup</th>
              <th>Industry</th>
              <th>Submitted</th>
              <th>Status</th>
              <th>Score</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="queue-list"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Review modal -->
  <div class="modal-overlay" id="review-overlay" aria-hidden="true">
    <div class="modal-card"
         id="review-card"
         role="dialog"
         aria-modal="true"
         aria-label="Portfolio review"
         tabindex="-1"></div>
  </div>

  <div class="reason-overlay" id="reason-overlay" aria-hidden="true" inert>
    <div class="reason-card"
         id="reason-card"
         role="dialog"
         aria-modal="true"
         aria-labelledby="reason-title"
         aria-describedby="reason-description"
         tabindex="-1">
      <h3 id="reason-title">Reject Portfolio</h3>
      <p id="reason-description">Please provide a reason for rejection. This feedback will be sent to the business owner.</p>
      <textarea class="reason-textarea"
                id="reason-textarea"
                aria-label="Rejection reason"
                aria-describedby="reason-description reason-error"
                placeholder="e.g. Weak market traction"></textarea>
      <div class="form-message reason-error"
           id="reason-error"
           role="alert"
           aria-live="assertive"></div>
      <div class="reason-footer">
        <button class="btn-cancel-outline" id="reason-cancel-btn" type="button">Cancel</button>
        <button class="btn-confirm-reject" id="reason-confirm-btn" type="button">Reject Portfolio</button>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=20260728.4"></script>
  <script src="js/moderatordashboard.js?v=20260728.4"></script>
</body>

</html>
